services:
  - type: web
    name: shorts-generator
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --threads 4"
    envVars:
      - key: APP_EMAIL
        value: admin@shortcraft.ai
      - key: APP_PASSWORD
        value: shortcraft2026
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
